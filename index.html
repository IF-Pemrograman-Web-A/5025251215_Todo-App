<!DOCTYPE html>
<html>
<head>
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <p class="small-title">ARAH HIDUP</p>
    <h1>My Todo List</h1>
    <p>Daftar kegitanmu biar gak malas.</p>

    <button id="modeButton" type="button">Dark Mode</button>
</header>

<main>

    <aside>
        <h2>Tasks</h2>

        <div id="taskList"></div>

        <div class="add-box">
            <h2>New Task</h2>

            <form id="addForm">

                <label>Task Name</label>
                <input id="taskName" type="text" placeholder="Nama tugas">

                <label>Short Description</label>
                <input id="taskDescription" type="text" placeholder="Deskripsi tugas">

                <button type="submit">Add Task</button>

            </form>
        </div>
    </aside>


    <section class="detail">

        <div class="detail-header">
            <h2>Task Details</h2>
            <span id="detailStatus" class="detail-status">Pending</span>
        </div>

        <form id="detailForm">

            <label>Task Name</label>
            <input id="detailName" type="text">

            <label>Description</label>
            <textarea id="detailDescription"></textarea>

            <label>Task Status</label>
            <select id="detailStatusSelect">
                <option value="Completed">Completed</option>
                <option value="Pending">Pending</option>
            </select>

            <div class="buttons">
                <button type="submit">Save Changes</button>
                <button type="button" id="deleteButton" class="delete">
                    Delete Task
                </button>
            </div>

        </form>

    </section>

</main>

<footer>
    <p>Todo List</p>
</footer>

<script src="script.js"></script>

</body>
</html>
